services:
  app:
    image: jenkins-cicd-demo:${APP_VERSION}
    container_name: jenkins-cicd-app
    restart: unless-stopped

    ports:
      - "${APP_PORT}:3000"

    environment:
      PORT: 3000
      DATA_DIR: /app/data
      APP_VERSION: ${APP_VERSION}

    volumes:
      - app_data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  app_data:
networks:
  jenkins:
    external: true